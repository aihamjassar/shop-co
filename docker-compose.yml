version: "3.9"
services:
  mongo:
    image: mongo
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - "mongo-data:/data/db"

  backend:
    build: ./server
    container_name: backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017/ecommerce
      - NODE_ENV=development
    depend_on:
      - mongo
    volumes:
      - ./server:/app

  frontend:
    build: ./client
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app

volumes:
  mongo-data:
